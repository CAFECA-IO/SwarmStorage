<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Laria recovery and fault tolerance</title>
<desc id="desc">Shards are checked by size and SHA-256; any 5 intact shards are decoded with Reed-Solomon, reassembled, decrypted and verified with AES-256-GCM before the output file is committed.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#ffffff}
  .panel{fill:#f6f8fa;stroke:#d0d7de}
  .box{fill:#ffffff;stroke:#afb8c1}
  .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{fill:#656d76;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h1{font-size:20px;font-weight:700}
  .h2{font-size:14px;font-weight:700}
  .b{font-size:12.5px}
  .s{font-size:11px}
  .data{fill:#ddf4ff;stroke:#0969da}
  .data-t{fill:#0550ae}
  .parity{fill:#fff8c5;stroke:#bf8700}
  .parity-t{fill:#7d4e00}
  .crypto{fill:#fbefff;stroke:#8250df}
  .crypto-t{fill:#6639ba}
  .ok{fill:#dafbe1;stroke:#1a7f37}
  .ok-t{fill:#116329}
  .bad{fill:#ffebe9;stroke:#cf222e}
  .bad-t{fill:#a40e26}
  .pad{fill:url(#hatch);stroke:#8c959f}
  .hatch-line{stroke:#afb8c1}
  .line{stroke:#57606a;fill:none}
  .dash{stroke-dasharray:5 4}
  .head{fill:#57606a}
  .step{fill:#0969da}
  .step-t{fill:#ffffff;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .box{fill:#0d1117;stroke:#484f58}
    .t{fill:#e6edf3}
    .m{fill:#8d96a0}
    .data{fill:#0c2d6b;stroke:#4493f8}
    .data-t{fill:#a5d6ff}
    .parity{fill:#3b2300;stroke:#d29922}
    .parity-t{fill:#f8e3a1}
    .crypto{fill:#271052;stroke:#a371f7}
    .crypto-t{fill:#e2c5ff}
    .ok{fill:#04260f;stroke:#3fb950}
    .ok-t{fill:#7ee787}
    .bad{fill:#3c0a0f;stroke:#f85149}
    .bad-t{fill:#ffa198}
    .pad{stroke:#6e7681}
    .hatch-line{stroke:#484f58}
    .line{stroke:#8d96a0}
    .head{fill:#8d96a0}
    .step{fill:#1f6feb}
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="head"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" class="hatch-line" stroke-width="2.5"/>
  </pattern>
</defs>
<rect class="bg" width="1000" height="580" rx="12"/>
<text x="32" y="44" class="t h1" text-anchor="start" >Recovery and fault tolerance</text>
<text x="32" y="66" class="m b" text-anchor="start" >recoverFile(shardsDir, outputFilePath, key) — any 5 intact shards out of 8 rebuild the file</text>
<rect x="32" y="82" width="220" height="366" rx="10" class="panel" />
<rect x="44" y="92" width="196" height="36" rx="6" class="ok" />
<text x="56" y="108" class="ok-t s mono" text-anchor="start" >shard-1.bin</text>
<text x="56" y="122" class="ok-t s" text-anchor="start" >D1 · intact</text>
<text x="224" y="116" class="ok-t h2" text-anchor="middle" >✓</text>
<rect x="44" y="136" width="196" height="36" rx="6" class="bad" stroke-dasharray="4 3"/>
<text x="56" y="152" class="bad-t s mono" text-anchor="start" >shard-2.bin</text>
<text x="56" y="166" class="bad-t s" text-anchor="start" >D2 · node offline</text>
<text x="224" y="160" class="bad-t h2" text-anchor="middle" >✗</text>
<rect x="44" y="180" width="196" height="36" rx="6" class="ok" />
<text x="56" y="196" class="ok-t s mono" text-anchor="start" >shard-3.bin</text>
<text x="56" y="210" class="ok-t s" text-anchor="start" >D3 · intact</text>
<text x="224" y="204" class="ok-t h2" text-anchor="middle" >✓</text>
<rect x="44" y="224" width="196" height="36" rx="6" class="bad" stroke-dasharray="4 3"/>
<text x="56" y="240" class="bad-t s mono" text-anchor="start" >shard-4.bin</text>
<text x="56" y="254" class="bad-t s" text-anchor="start" >D4 · node offline</text>
<text x="224" y="248" class="bad-t h2" text-anchor="middle" >✗</text>
<rect x="44" y="268" width="196" height="36" rx="6" class="ok" />
<text x="56" y="284" class="ok-t s mono" text-anchor="start" >shard-5.bin</text>
<text x="56" y="298" class="ok-t s" text-anchor="start" >D5 · intact</text>
<text x="224" y="292" class="ok-t h2" text-anchor="middle" >✓</text>
<rect x="44" y="312" width="196" height="36" rx="6" class="ok" />
<text x="56" y="328" class="ok-t s mono" text-anchor="start" >shard-6.bin</text>
<text x="56" y="342" class="ok-t s" text-anchor="start" >P1 · intact</text>
<text x="224" y="336" class="ok-t h2" text-anchor="middle" >✓</text>
<rect x="44" y="356" width="196" height="36" rx="6" class="bad" stroke-dasharray="4 3"/>
<text x="56" y="372" class="bad-t s mono" text-anchor="start" >shard-7.bin</text>
<text x="56" y="386" class="bad-t s" text-anchor="start" >P2 · SHA-256 mismatch</text>
<text x="224" y="380" class="bad-t h2" text-anchor="middle" >✗</text>
<rect x="44" y="400" width="196" height="36" rx="6" class="ok" />
<text x="56" y="416" class="ok-t s mono" text-anchor="start" >shard-8.bin</text>
<text x="56" y="430" class="ok-t s" text-anchor="start" >P3 · intact</text>
<text x="224" y="424" class="ok-t h2" text-anchor="middle" >✓</text>
<line x1="252" y1="140" x2="284" y2="140" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="290" y="82" width="212" height="150" rx="10" class="box" stroke-width="1.5"/>
<circle cx="312" cy="106" r="11" class="step"/><text x="312" y="110" class="step-t s" text-anchor="middle" >1</text>
<text x="332" y="111" class="t h2" text-anchor="start" >Inspect shards</text>
<text x="306" y="138" class="t s" text-anchor="start" >read metadata.json</text>
<text x="306" y="156" class="t s" text-anchor="start" >check each file’s size and</text>
<text x="306" y="174" class="t s" text-anchor="start" >SHA-256 against metadata</text>
<text x="306" y="192" class="t s" text-anchor="start" >bad checksum = missing</text>
<text x="306" y="210" class="t s" text-anchor="start" >→ 5 intact, 3 unusable</text>
<rect x="533" y="82" width="212" height="150" rx="10" class="box" stroke-width="1.5"/>
<circle cx="555" cy="106" r="11" class="step"/><text x="555" y="110" class="step-t s" text-anchor="middle" >2</text>
<text x="575" y="111" class="t h2" text-anchor="start" >Pick any 5</text>
<text x="549" y="138" class="t s" text-anchor="start" >lowest indices first</text>
<text x="549" y="156" class="t s" text-anchor="start" >(data shards need no decode)</text>
<text x="549" y="174" class="t s" text-anchor="start" ></text>
<text x="549" y="192" class="t s" text-anchor="start" ></text>
<text x="549" y="210" class="t s" text-anchor="start" >read only 5 files</text>
<rect x="549" y="166" width="33" height="24" rx="4" class="data" />
<text x="565.5" y="182" class="data-t s mono" text-anchor="middle" >#1</text>
<rect x="586" y="166" width="33" height="24" rx="4" class="data" />
<text x="602.5" y="182" class="data-t s mono" text-anchor="middle" >#3</text>
<rect x="623" y="166" width="33" height="24" rx="4" class="data" />
<text x="639.5" y="182" class="data-t s mono" text-anchor="middle" >#5</text>
<rect x="660" y="166" width="33" height="24" rx="4" class="parity" />
<text x="676.5" y="182" class="parity-t s mono" text-anchor="middle" >#6</text>
<rect x="697" y="166" width="33" height="24" rx="4" class="parity" />
<text x="713.5" y="182" class="parity-t s mono" text-anchor="middle" >#8</text>
<rect x="776" y="82" width="212" height="150" rx="10" class="box" stroke-width="1.5"/>
<circle cx="798" cy="106" r="11" class="step"/><text x="798" y="110" class="step-t s" text-anchor="middle" >3</text>
<text x="818" y="111" class="t h2" text-anchor="start" >Reed-Solomon decode</text>
<text x="792" y="138" class="t s" text-anchor="start" >take the 5 rows of E for</text>
<text x="792" y="156" class="t s" text-anchor="start" >shards #1 #3 #5 #6 #8</text>
<text x="792" y="174" class="t s" text-anchor="start" >invert that 5×5 matrix</text>
<text x="792" y="192" class="t s" text-anchor="start" >rebuild D2 and D4</text>
<text x="792" y="210" class="t s" text-anchor="start" >for every stripe</text>
<rect x="776" y="270" width="212" height="150" rx="10" class="box" stroke-width="1.5"/>
<circle cx="798" cy="294" r="11" class="step"/><text x="798" y="298" class="step-t s" text-anchor="middle" >4</text>
<text x="818" y="299" class="t h2" text-anchor="start" >Reassemble</text>
<text x="792" y="326" class="t s" text-anchor="start" >stream D1…D5 of each stripe</text>
<text x="792" y="344" class="t s" text-anchor="start" >in order</text>
<text x="792" y="362" class="t s" text-anchor="start" >cut the last stripe at</text>
<text x="792" y="380" class="t s" text-anchor="start" >originalFileSize</text>
<text x="792" y="398" class="t s" text-anchor="start" >(drops the zero padding)</text>
<rect x="533" y="270" width="212" height="150" rx="10" class="crypto" stroke-width="1.5"/>
<circle cx="555" cy="294" r="11" class="step"/><text x="555" y="298" class="step-t s" text-anchor="middle" >5</text>
<text x="575" y="299" class="crypto-t h2" text-anchor="start" >Decrypt + verify</text>
<text x="549" y="326" class="t s" text-anchor="start" >AES-256-GCM with the key,</text>
<text x="549" y="344" class="t s" text-anchor="start" >IV and auth tag</text>
<text x="549" y="362" class="t s" text-anchor="start" >write to *.partial</text>
<text x="549" y="380" class="t s" text-anchor="start" >wrong key / tampering</text>
<text x="549" y="398" class="t s" text-anchor="start" >→ tag check fails</text>
<rect x="290" y="270" width="212" height="150" rx="10" class="ok" stroke-width="1.5"/>
<circle cx="312" cy="294" r="11" class="step"/><text x="312" y="298" class="step-t s" text-anchor="middle" >6</text>
<text x="332" y="299" class="ok-t h2" text-anchor="start" >Commit</text>
<text x="306" y="326" class="t s" text-anchor="start" >tag valid:</text>
<text x="306" y="344" class="t s" text-anchor="start" >rename *.partial → output</text>
<text x="306" y="362" class="t s" text-anchor="start" ></text>
<text x="306" y="380" class="t s" text-anchor="start" >tag invalid:</text>
<text x="306" y="398" class="t s" text-anchor="start" >delete *.partial, throw</text>
<line x1="502" y1="157" x2="529" y2="157" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="745" y1="157" x2="772" y2="157" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="882.0" y1="232" x2="882.0" y2="266" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="776" y1="345" x2="749" y2="345" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="533" y1="345" x2="506" y2="345" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="32" y="484" class="t h2" text-anchor="start" >Tolerance per file (n = 8, k = 5)</text>
<rect x="32.0" y="496" width="302.6666666666667" height="58" rx="10" class="ok" />
<text x="48.0" y="520" class="ok-t h2" text-anchor="start" >0 lost</text>
<text x="48.0" y="540" class="ok-t s" text-anchor="start" >read D1–D5 directly, no decoding</text>
<rect x="348.6666666666667" y="496" width="302.6666666666667" height="58" rx="10" class="ok" />
<text x="364.6666666666667" y="520" class="ok-t h2" text-anchor="start" >1 – 3 lost or corrupted</text>
<text x="364.6666666666667" y="540" class="ok-t s" text-anchor="start" >rebuilt from parity — no data loss</text>
<rect x="665.3333333333334" y="496" width="302.6666666666667" height="58" rx="10" class="bad" />
<text x="681.3333333333334" y="520" class="bad-t h2" text-anchor="start" >4 or more</text>
<text x="681.3333333333334" y="540" class="bad-t s" text-anchor="start" >unrecoverable — recoverFile() throws</text>
</svg>
