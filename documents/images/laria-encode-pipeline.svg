<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Laria encode pipeline</title>
<desc id="desc">A file is encrypted with AES-256-GCM, cut into 20 MB stripes, and each stripe is split into 5 data shards plus 3 Reed-Solomon parity shards.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#ffffff}
  .panel{fill:#f6f8fa;stroke:#d0d7de}
  .box{fill:#ffffff;stroke:#afb8c1}
  .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{fill:#656d76;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h1{font-size:20px;font-weight:700}
  .h2{font-size:14px;font-weight:700}
  .b{font-size:12.5px}
  .s{font-size:11px}
  .data{fill:#ddf4ff;stroke:#0969da}
  .data-t{fill:#0550ae}
  .parity{fill:#fff8c5;stroke:#bf8700}
  .parity-t{fill:#7d4e00}
  .crypto{fill:#fbefff;stroke:#8250df}
  .crypto-t{fill:#6639ba}
  .ok{fill:#dafbe1;stroke:#1a7f37}
  .ok-t{fill:#116329}
  .bad{fill:#ffebe9;stroke:#cf222e}
  .bad-t{fill:#a40e26}
  .pad{fill:url(#hatch);stroke:#8c959f}
  .hatch-line{stroke:#afb8c1}
  .line{stroke:#57606a;fill:none}
  .dash{stroke-dasharray:5 4}
  .head{fill:#57606a}
  .step{fill:#0969da}
  .step-t{fill:#ffffff;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .box{fill:#0d1117;stroke:#484f58}
    .t{fill:#e6edf3}
    .m{fill:#8d96a0}
    .data{fill:#0c2d6b;stroke:#4493f8}
    .data-t{fill:#a5d6ff}
    .parity{fill:#3b2300;stroke:#d29922}
    .parity-t{fill:#f8e3a1}
    .crypto{fill:#271052;stroke:#a371f7}
    .crypto-t{fill:#e2c5ff}
    .ok{fill:#04260f;stroke:#3fb950}
    .ok-t{fill:#7ee787}
    .bad{fill:#3c0a0f;stroke:#f85149}
    .bad-t{fill:#ffa198}
    .pad{stroke:#6e7681}
    .hatch-line{stroke:#484f58}
    .line{stroke:#8d96a0}
    .head{fill:#8d96a0}
    .step{fill:#1f6feb}
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="head"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" class="hatch-line" stroke-width="2.5"/>
  </pattern>
</defs>
<rect class="bg" width="1000" height="500" rx="12"/>
<text x="32" y="44" class="t h1" text-anchor="start" >Laria encode pipeline</text>
<text x="32" y="66" class="m b" text-anchor="start" >encodeFile(filePath, outputDir) — streaming, constant memory (one 20 MB stripe + 3 parity buffers)</text>
<path d="M40,96 h96 l22,22 v84 h-118 z" class="box" stroke-width="1.5"/>
<path d="M136,96 v22 h22" class="line" stroke-width="1.5"/>
<text x="99" y="146" class="t h2" text-anchor="middle" >Original file</text>
<text x="99" y="166" class="m s" text-anchor="middle" >plaintext</text>
<text x="99" y="182" class="m s mono" text-anchor="middle" >N bytes</text>
<line x1="166" y1="150" x2="214" y2="150" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="220" y="90" width="240" height="120" rx="10" class="crypto" stroke-width="1.5"/>
<text x="340" y="114" class="crypto-t h2" text-anchor="middle" >AES-256-GCM (stream)</text>
<text x="236" y="138" class="crypto-t s mono" text-anchor="start" >key</text>
<text x="270" y="138" class="t s" text-anchor="start" >256-bit, random per file</text>
<text x="236" y="156" class="crypto-t s mono" text-anchor="start" >IV</text>
<text x="270" y="156" class="t s" text-anchor="start" >96-bit, random</text>
<text x="236" y="174" class="crypto-t s mono" text-anchor="start" >out</text>
<text x="270" y="174" class="t s" text-anchor="start" >ciphertext, N bytes</text>
<text x="236" y="192" class="crypto-t s mono" text-anchor="start" >tag</text>
<text x="270" y="192" class="t s" text-anchor="start" >128-bit auth tag → metadata</text>
<rect x="220" y="222" width="240" height="40" rx="8" class="crypto" stroke-dasharray="4 3"/>
<text x="340" y="239" class="crypto-t s" text-anchor="middle" >key → returned to the caller</text>
<text x="340" y="254" class="crypto-t s" text-anchor="middle" >never written to metadata.json</text>
<line x1="460" y1="150" x2="500" y2="150" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="506" y="84" width="462" height="178" rx="10" class="panel" />
<text x="524" y="108" class="t h2" text-anchor="start" >Ciphertext is cut into 20 MB stripes</text>
<rect x="524" y="124" width="132" height="40" rx="4" class="data" />
<text x="590.0" y="149" class="data-t s" text-anchor="middle" >Stripe 1</text>
<rect x="660" y="124" width="132" height="40" rx="4" class="data" />
<text x="726.0" y="149" class="data-t s" text-anchor="middle" >Stripe 2</text>
<rect x="796" y="124" width="80" height="40" rx="4" class="data" />
<text x="836.0" y="149" class="data-t s" text-anchor="middle" >Stripe N</text>
<rect x="876" y="124" width="74" height="40" rx="4" class="pad" />
<path d="M524,172 v6 h132 v-6" class="line" stroke-width="1"/>
<text x="590.0" y="194" class="m s mono" text-anchor="middle" >20 MB</text>
<path d="M660,172 v6 h132 v-6" class="line" stroke-width="1"/>
<text x="726.0" y="194" class="m s mono" text-anchor="middle" >20 MB</text>
<path d="M796,172 v6 h154 v-6" class="line" stroke-width="1"/>
<text x="824" y="206" class="m s" text-anchor="middle" >last stripe padded to 20 MB</text>
<text x="824" y="222" class="m s" text-anchor="middle" >(trimmed on recovery via originalFileSize)</text>
<text x="594" y="222" class="m s mono" text-anchor="middle" >stripeCount = ⌈N / 20 MB⌉</text>
<rect x="32" y="290" width="936" height="186" rx="10" class="panel" />
<text x="50" y="314" class="t h2" text-anchor="start" >For every stripe</text>

<text x="181" y="340" class="m s" text-anchor="middle" >1 stripe = 20 MB</text>
<rect x="56" y="352" width="48" height="44" rx="4" class="data" />
<text x="80" y="379" class="data-t b mono" text-anchor="middle" >D1</text>
<rect x="106" y="352" width="48" height="44" rx="4" class="data" />
<text x="130" y="379" class="data-t b mono" text-anchor="middle" >D2</text>
<rect x="156" y="352" width="48" height="44" rx="4" class="data" />
<text x="180" y="379" class="data-t b mono" text-anchor="middle" >D3</text>
<rect x="206" y="352" width="48" height="44" rx="4" class="data" />
<text x="230" y="379" class="data-t b mono" text-anchor="middle" >D4</text>
<rect x="256" y="352" width="48" height="44" rx="4" class="data" />
<text x="280" y="379" class="data-t b mono" text-anchor="middle" >D5</text>
<text x="181" y="418" class="m s" text-anchor="middle" >5 data shards × 4 MB</text>
<line x1="310" y1="374" x2="352" y2="374" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="358" y="322" width="268" height="132" rx="10" class="box" stroke-width="1.5"/>
<text x="492" y="344" class="t h2" text-anchor="middle" >Reed-Solomon (8, 5) over GF(2⁸)</text>
<path d="M382,358 h-6 v84 h6 M462,358 h6 v84 h-6" class="line" stroke-width="1.4"/>
<rect x="382" y="362" width="80" height="46" rx="3" class="data" />
<text x="422" y="390" class="data-t s" text-anchor="middle" >I₅ (identity)</text>
<rect x="382" y="412" width="80" height="26" rx="3" class="parity" />
<text x="422" y="429" class="parity-t s" text-anchor="middle" >C (3 × 5)</text>
<text x="484" y="372" class="t s mono" text-anchor="start" >E = V · V₅⁻¹</text>
<text x="484" y="390" class="m s" text-anchor="start" >V = 8×5 Vandermonde</text>
<text x="484" y="412" class="t s mono" text-anchor="start" >Pⱼ = ⊕ cⱼᵢ · Dᵢ</text>
<text x="484" y="430" class="m s" text-anchor="start" >any 5 rows of E</text>
<text x="484" y="445" class="m s" text-anchor="start" >are invertible</text>
<line x1="626" y1="374" x2="668" y2="374" class="line" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="814" y="340" class="m s" text-anchor="middle" >8 shards × 4 MB</text>
<rect x="674" y="352" width="33" height="44" rx="4" class="data" />
<text x="690.5" y="379" class="data-t s mono" text-anchor="middle" >D1</text>
<rect x="709" y="352" width="33" height="44" rx="4" class="data" />
<text x="725.5" y="379" class="data-t s mono" text-anchor="middle" >D2</text>
<rect x="744" y="352" width="33" height="44" rx="4" class="data" />
<text x="760.5" y="379" class="data-t s mono" text-anchor="middle" >D3</text>
<rect x="779" y="352" width="33" height="44" rx="4" class="data" />
<text x="795.5" y="379" class="data-t s mono" text-anchor="middle" >D4</text>
<rect x="814" y="352" width="33" height="44" rx="4" class="data" />
<text x="830.5" y="379" class="data-t s mono" text-anchor="middle" >D5</text>
<rect x="849" y="352" width="33" height="44" rx="4" class="parity" />
<text x="865.5" y="379" class="parity-t s mono" text-anchor="middle" >P1</text>
<rect x="884" y="352" width="33" height="44" rx="4" class="parity" />
<text x="900.5" y="379" class="parity-t s mono" text-anchor="middle" >P2</text>
<rect x="919" y="352" width="33" height="44" rx="4" class="parity" />
<text x="935.5" y="379" class="parity-t s mono" text-anchor="middle" >P3</text>
<path d="M674,404 v5 h173 v-5" class="line" stroke-width="1"/>
<text x="760" y="422" class="m s" text-anchor="middle" >data (unchanged)</text>
<path d="M849,404 v5 h103 v-5" class="line" stroke-width="1"/>
<text x="901" y="422" class="m s" text-anchor="middle" >parity</text>
<text x="814" y="448" class="t s" text-anchor="middle" >shard i is appended to shard-i.bin</text>
<text x="814" y="464" class="m s" text-anchor="middle" >and fed into its running SHA-256</text>
</svg>
