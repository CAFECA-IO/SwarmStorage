# Info: (20261106 - Luphia)
# 共用 LiveKit (DropHere + Hills)：docker compose up -d 即完成
# - livekit-init：第一次自動產生 API key / secret，並依 .env 產生 livekit.yaml、Caddyfile
# - caddy：自動申請 Let's Encrypt 憑證 (wss 信令與 TURN/TLS)
# - livekit：媒體走 UDP，使用 host 網路
# 只使用 named volume、不掛載主機檔案，遠端 Docker context 也能部署
services:
  livekit-init:
    build: .
    entrypoint: ["/bin/sh", "/opt/drophere/init.sh"]
    env_file: .env
    volumes:
      - livekit-config:/config
    restart: "no"

  caddy:
    image: caddy:2
    # Info: (20261108 - Luphia) 設定放在 /etc/livekit；/config 留給 Caddy 自己 (XDG_CONFIG_HOME)
    command: caddy run --config /etc/livekit/Caddyfile --adapter caddyfile
    network_mode: host
    restart: unless-stopped
    depends_on:
      livekit-init:
        condition: service_completed_successfully
    volumes:
      - livekit-config:/etc/livekit:ro
      - caddy-data:/data

  livekit:
    build: .
    network_mode: host
    restart: unless-stopped
    # Info: (20261108 - Luphia) 不傳入整份 .env：livekit-server 會讀取 LIVEKIT_* / NODE_IP 等環境變數覆蓋設定
    environment:
      CERT_RELOAD_HOUR_UTC: ${CERT_RELOAD_HOUR_UTC:-20}
    depends_on:
      livekit-init:
        condition: service_completed_successfully
    volumes:
      - livekit-config:/config:ro
      - caddy-data:/caddy:ro
    tmpfs:
      - /run/livekit

volumes:
  livekit-config:
  caddy-data:
